  <!-- opened from the iPhone home screen, the page runs full screen without Safari's bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Learning Vocabulary</title>
  <script>
    // phones get a full-screen, swipeable "reel" (like TikTok / Reels) instead of the flip card
    var REEL = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    if (REEL) document.documentElement.classList.add("reel");
  </script>
</head>
<body>
	
<header class="header-10">
    <div class="container">
      <ul class="pull-left">
        <a href="../index.html">Flash Card</a>

</header>

</header>
<section>
<div class="flip-card" id="card">
  <div class="flip-card-inner" id="cardInner">
    <div class="flip-card-front" id="front">
      <h1 id="word">Welcome to my Vocab Lab<br>Click Arrow to start</h1>
    </div>
    <div class="flip-card-back" id="back">
      <div class="def" id="definition">test</div>
      <div class="lang" id ="language"></div>
      <div id="vclips"></div>
      <div id="yg-box">
      <a  id="yg-widget-0" class="youglish-widget" href="https://youglish.com">Visit YouGlish.com</a>
      <div id="yg-shield"></div><!-- reel: catches swipes over the YouGlish frame; tap = pause / play -->
      </div>
    </div>
  </div>
</div>
<!-- reel (phones only): the word and definition move here, over the video -->
<div id="reel-info">
  <div class="reveal-hint" id="reveal-hint">Tap to see the meaning</div>
</div>
<div id="reel-start">
  <button type="button" id="reel-start-btn">▶ Tap to start</button>
  <p>Swipe ↑ ↓ to change word<br>Swipe ← → for more videos<br>Tap the video to pause</p>
</div>

<button class = "previous" onclick="previous()"><img width="50" height="50" src="../img/backward.png" alt="circled-left-2--v1"/></button>
<button class = "next" onclick="next()"><img width="50" height="50" src="../img/forward.png" alt="end"/></button>
</section>
</body>

<script src="https://unpkg.com/whatwg-fetch@3.6.2/dist/fetch.umd.js"></script>
<script src="../clips/clips.js"></script>
<script>
  VocabClips.mount(document.getElementById("vclips"), { reel: REEL });

    // ── Reel (phones): full screen, swipe up / down = next / previous word, left / right = next / previous video ──
    var reelStarted = false;
    var ygPaused = false;

    // the definition stays blurred until tapped, like the back of the flash card
    function veil(on) {
      document.getElementById("definition").classList.toggle("veiled", on);
      document.getElementById("reveal-hint").hidden = !on;
    }

    function playCurrent() {
      if (!words.length) return;
      flipCard(document.getElementById("word").innerHTML, document.getElementById("language").innerHTML);
      VocabClips.prefetch(words[(index + 3) % words.length]); // the word a swipe up will show
    }

    // the first tap also lets the iPhone play videos with sound
    function startReel() {
      if (reelStarted) return;
      reelStarted = true;
      document.getElementById("reel-start").hidden = true;
      playCurrent();
    }

    // next / previous video: our own clips first, otherwise the YouGlish widget
    function stepVideo(d) {
      if (VocabClips.step(d)) return;
      if (widget && document.getElementById("yg-box").style.display !== "none") {
        try { d > 0 ? widget.next() : widget.previous(); } catch (e) {}
      }
    }

    if (REEL) {
      const info = document.getElementById("reel-info");
      info.insertBefore(document.getElementById("word"), info.firstChild);
      info.insertBefore(document.getElementById("definition"), document.getElementById("reveal-hint"));
      veil(true);
      document.getElementById("yg-box").style.display = "none"; // shown only when a word has no clips
      info.addEventListener("click", () => veil(!document.getElementById("definition").classList.contains("veiled")));
      document.getElementById("reel-start").addEventListener("click", startReel);
      // touches inside the YouGlish frame never reach the page, so a layer over it takes them
      document.getElementById("yg-shield").addEventListener("click", () => {
        if (!widget) return;
        try { if (ygPaused) widget.play(); else widget.pause(); ygPaused = !ygPaused; } catch (e) {}
      });

      // listen on the whole document: a listener on #card (display: contents, no box of its own)
      // can't stop the browser from scrolling, which is why swipes did nothing on iPhone
      const swipeThreshold = 50; // minimum swipe distance in px
      let x0 = 0, y0 = 0, tracking = false;
      // the header links and the Matching batch list scroll by themselves
      const scrollsItself = t => !!(t && t.closest && t.closest(".header-10, .batch-banner"));

      document.addEventListener("touchstart", e => {
        tracking = e.touches.length === 1 && !scrollsItself(e.target);
        if (tracking) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }
      }, { passive: true });
      document.addEventListener("touchmove", e => { if (tracking) e.preventDefault(); }, { passive: false });
      document.addEventListener("touchcancel", () => { tracking = false; });
      document.addEventListener("touchend", e => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < swipeThreshold) return; // a tap: buttons handle it
        if (Math.abs(dy) > Math.abs(dx)) {
          if (dy < 0) next();          // Swipe Up
          else previous();             // Swipe Down
        } else {
          stepVideo(dx < 0 ? 1 : -1);  // Swipe Left / Right
        }
        startReel();
      }, { passive: true });
    }


  // stop the clip / YouGlish and pre-load the next word's clips whenever the card changes;
  // in the reel the new word's videos start straight away
  window.addEventListener("load", function () {
    ["next", "previous", "randomWord", "showCard"].forEach(function (name) {
      var orig = window[name];
      if (typeof orig !== "function") return;
      window[name] = function () {
        flipSeq++; // cancel a flip that is still waiting for the clip lookup
        VocabClips.stop();
        stopYouGlish();
        var r = orig.apply(this, arguments);
        if (REEL) veil(true);
        if (REEL && reelStarted) playCurrent();
        else VocabClips.prefetch(document.getElementById("word").textContent);
        return r;
      };
    });
  });
</script>
<script>

  // read list from txt file
let words = []; // declare the variable outside the block

fetch('../lib.txt')
  .then(response => response.text())
  .then(text => {
    var row = text.replace(/\r/g, "").split('\n');
    row.forEach(line => {
      var lineWords = line.split('\t');
      if (lineWords[2] === 'English') {
        words.push(lineWords[0], lineWords[1], lineWords[2]);
      }
    });
    applyMatchingBatch(); // if the Matching game saved a batch, review those words
    if (!batchActive) randomWord(); // otherwise pick a random vocabulary on each refresh
    if (REEL && reelStarted) playCurrent(); // the learner tapped "start" before the words arrived
  })
  .catch(error => console.error(error));

  let index = 0;

// pick a random word triplet and display it (runs on every page refresh)
function randomWord() {
  if (words.length === 0) return;
  index = Math.floor(Math.random() * (words.length / 3)) * 3;
  document.getElementById("word").innerHTML = words[index];
  document.getElementById("definition").innerHTML = words[index+1];
  document.getElementById("language").innerHTML = words[index+2];
  document.getElementById("cardInner").style.transform = "";
}

// true while the page is showing a batch fed from the Matching game
let batchActive = false;

// if the Matching game saved a batch for this language, review exactly those words
function applyMatchingBatch() {
  try {
    var saved = JSON.parse(localStorage.getItem('vb_batch_English'));
    if (!Array.isArray(saved) || !saved.length) return;
    words = [];
    saved.forEach(function (p) { words.push(p.word, p.def, 'English'); });
    batchActive = true;
    showBatchBanner(saved);
    index = 0;
    showCard(0); // start at the first batch word so it's clear the batch loaded
  } catch (e) { console.error(e); }
}

// display the triplet at position i (word / definition / language)
function showCard(i) {
  document.getElementById("word").innerHTML = words[i];
  document.getElementById("definition").innerHTML = words[i + 1];
  document.getElementById("language").innerHTML = words[i + 2];
  document.getElementById("cardInner").style.transform = "";
}

function showBatchBanner(batch) {
  var bar = document.createElement('div');
  bar.className = 'batch-banner';

  var label = document.createElement('span');
  label.textContent = 'Reviewing ' + batch.length + ' words from your last Matching round. ';
  bar.appendChild(label);

  var listBtn = document.createElement('button');
  listBtn.className = 'batch-banner-btn';
  listBtn.textContent = 'View list';
  bar.appendChild(listBtn);

  var allBtn = document.createElement('button');
  allBtn.className = 'batch-banner-btn';
  allBtn.textContent = 'Show full dictionary';
  allBtn.onclick = function () { localStorage.removeItem('vb_batch_English'); location.reload(); };
  bar.appendChild(allBtn);

  var list = document.createElement('ul');
  list.className = 'batch-list';
  list.style.display = 'none';
  batch.forEach(function (p) {
    var li = document.createElement('li');
    li.textContent = p.word + ' — ' + p.def;
    list.appendChild(li);
  });
  bar.appendChild(list);

  listBtn.onclick = function () {
    var open = list.style.display !== 'none';
    list.style.display = open ? 'none' : 'block';
    listBtn.textContent = open ? 'View list' : 'Hide list';
  };

  var header = document.querySelector('header.header-10');
  if (header) header.insertAdjacentElement('afterend', bar);
  else document.body.insertBefore(bar, document.body.firstChild);
}
// switch to next
function next() {
  index = (index + 3) % words.length;
  document.getElementById("word").innerHTML = words[index];
  document.getElementById("definition").innerHTML = words[index+1];
  document.getElementById("language").innerHTML=words[index+2];
  document.getElementById("cardInner").style.transform = "";
  console.log(words[index+1])
}
// switch to previous
function previous() {
  index = (index - 3 + words.length) % words.length;
  document.getElementById("word").innerHTML = words[index];
  document.getElementById("definition").innerHTML = words[index+1];
  document.getElementById("language").innerHTML=words[index+2] 
  document.getElementById("cardInner").style.transform = "";
}
// log result from next and previous

document.getElementById("cardInner").addEventListener("click",()=>{
  if (REEL) return; // the reel plays without flipping
  const output = document.getElementById("word").innerHTML;
  const lang = document.getElementById("language").innerHTML;
  document.getElementById("cardInner").style.transform = "rotateY(180deg)";
  console.log(output,lang);
  flipCard(output,lang);
})

// flip card: play clips from our own index (free sources) first; fall back to P
var flipSeq = 0; // bumped on every flip and card change so a stale lookup can't start YouGlish
function flipCard(output,lang){
  var seq = ++flipSeq;
  stopYouGlish();
  VocabClips.show(output, lang, { fallback: function(){ showYouGlish(output,lang); } })
    .then(function(found){ if (seq !== flipSeq) return; if (!found) showYouGlish(output,lang); })
    .catch(function(){ if (seq === flipSeq) showYouGlish(output,lang); });
}
function showYouGlish(output,lang){
  document.getElementById("yg-box").style.display = "";
  ygPaused = false;
  onYouglishAPIReady(output,lang);
}
function stopYouGlish(){
  document.getElementById("yg-box").style.display = "none";
  if (!widget) return;
  try { widget.pause(); } catch (e) {}
}

var widget;
      <!-- Wait for YG library to be loaded -->
      function onYouglishAPIReady(output,lang) {
        if (!output || typeof YG === "undefined") return; // YouGlish also calls this on load with no word
        <!-- retrieve the widget object-->
        widget = YG.getWidget("yg-widget-0");
        <!-- use the API...-->
        widget.fetch(output,lang);
      }
      function onCaptionConsumed(event){
        if (++views < 3)
          widget.replay();
        else 
          if (curTrack < totalTracks)  
            widget.next();
      }
</script>
