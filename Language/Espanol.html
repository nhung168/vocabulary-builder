<html>

<body>
	
<header class="header-10">
    <div class="container">
      <ul class="pull-left">
        <a href="../index.html">Flash Card</a>
        <a href="../list.html">My Dictionary</a>
        <a href="../Data.html">Practice</a>
        <a href="../index-ai.html">Listening</a>

</header>

<section>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div class="flip-card" id="card">
  <div class="flip-card-inner" id="cardInner">
    <div class="flip-card-front" id="front">
      <h1 id="word">Welcome to my Vocab Lab<br>Click Arrow to start</h1>
    </div>
    <div class="flip-card-back" id="back">
      <div class="def" id="definition">test</div>
      <div class="lang" id ="language"></div>
      <div>
      <a  id="yg-widget-0" class="youglish-widget" href="https://youglish.com">Visit YouGlish.com</a>
      </div>
    </div>
  </div>
</div>

<button class = "previous" onclick="previous()"><img width="50" height="50" src="../img/backward.png" alt="circled-left-2--v1"/></button>
<button class = "next" onclick="next()"><img width="50" height="50" src="../img/forward.png" alt="end"/></button>
</section>

<script src="https://unpkg.com/whatwg-fetch@3.6.2/dist/fetch.umd.js"></script>
<script>

  // read list from txt file
let words = []; // declare the variable outside the block

fetch('../lib.txt')
  .then(response => response.text())
  .then(text => {
    var row = text.replace(/\r/g, "").split('\n');
    row.forEach(line => {
      var lineWords = line.split('\t');
      if (lineWords[2] === 'Spanish') {
        words.push(lineWords[0], lineWords[1], lineWords[2]);
      }
    });
    applyMatchingBatch(); // if the Matching game saved a batch, review those words
    if (!batchActive) randomWord(); // otherwise pick a random vocabulary on each refresh
  })
  .catch(error => console.error(error));

  let index = 0;

// pick a random word triplet and display it (runs on every page refresh)
function randomWord() {
  if (words.length === 0) return;
  index = Math.floor(Math.random() * (words.length / 3)) * 3;
  document.getElementById("word").innerHTML = words[index];
  document.getElementById("definition").innerHTML = words[index+1];
  document.getElementById("language").innerHTML = words[index+2];
  document.getElementById("cardInner").style.transform = "";
}

// true while the page is showing a batch fed from the Matching game
let batchActive = false;

// if the Matching game saved a batch for this language, review exactly those words
function applyMatchingBatch() {
  try {
    var saved = JSON.parse(localStorage.getItem('vb_batch_Spanish'));
    if (!Array.isArray(saved) || !saved.length) return;
    words = [];
    saved.forEach(function (p) { words.push(p.word, p.def, 'Spanish'); });
    batchActive = true;
    showBatchBanner(saved);
    index = 0;
    showCard(0); // start at the first batch word so it's clear the batch loaded
  } catch (e) { console.error(e); }
}

// display the triplet at position i (word / definition / language)
function showCard(i) {
  document.getElementById("word").innerHTML = words[i];
  document.getElementById("definition").innerHTML = words[i + 1];
  document.getElementById("language").innerHTML = words[i + 2];
  document.getElementById("cardInner").style.transform = "";
}

function showBatchBanner(batch) {
  var bar = document.createElement('div');
  bar.className = 'batch-banner';

  var label = document.createElement('span');
  label.textContent = 'Reviewing ' + batch.length + ' words from your last Matching round. ';
  bar.appendChild(label);

  var listBtn = document.createElement('button');
  listBtn.className = 'batch-banner-btn';
  listBtn.textContent = 'View list';
  bar.appendChild(listBtn);

  var allBtn = document.createElement('button');
  allBtn.className = 'batch-banner-btn';
  allBtn.textContent = 'Show full dictionary';
  allBtn.onclick = function () { localStorage.removeItem('vb_batch_Spanish'); location.reload(); };
  bar.appendChild(allBtn);

  var list = document.createElement('ul');
  list.className = 'batch-list';
  list.style.display = 'none';
  batch.forEach(function (p) {
    var li = document.createElement('li');
    li.textContent = p.word + ' — ' + p.def;
    list.appendChild(li);
  });
  bar.appendChild(list);

  listBtn.onclick = function () {
    var open = list.style.display !== 'none';
    list.style.display = open ? 'none' : 'block';
    listBtn.textContent = open ? 'View list' : 'Hide list';
  };

  var header = document.querySelector('header.header-10');
  if (header) header.insertAdjacentElement('afterend', bar);
  else document.body.insertBefore(bar, document.body.firstChild);
}
// switch to next
function next() {
  index = (index + 3) % words.length;
  document.getElementById("word").innerHTML = words[index];
  document.getElementById("definition").innerHTML = words[index+1];
  document.getElementById("language").innerHTML=words[index+2];
  document.getElementById("cardInner").style.transform = "";
  console.log(words[index+1])
}
// switch to previous
function previous() {
  index = (index - 3 + words.length) % words.length;
  document.getElementById("word").innerHTML = words[index];
  document.getElementById("definition").innerHTML = words[index+1];
  document.getElementById("language").innerHTML=words[index+2] 
  document.getElementById("cardInner").style.transform = "";
}
// log result from next and previous

document.getElementById("cardInner").addEventListener("click",()=>{
  const output = document.getElementById("word").innerHTML;
  const lang = document.getElementById("language").innerHTML;
  document.getElementById("cardInner").style.transform = "rotateY(180deg)";
  console.log(output,lang);
  flipCard(output,lang);
})

// flip card
function flipCard(output,lang){
      var youglish = document.getElementById("yg-widget-0")
      onYouglishAPIReady(output,lang)
}

var widget;
      <!-- Wait for YG library to be loaded -->
      function onYouglishAPIReady(output,lang) {
        <!-- retrieve the widget object-->
        widget = YG.getWidget("yg-widget-0");
        <!-- use the API...-->
        widget.fetch(output,lang);
      }
      function onCaptionConsumed(event){
        if (++views < 3)
          widget.replay();
        else 
          if (curTrack < totalTracks)  
            widget.next();
      }
</script>
<script async src="https://youglish.com/public/emb/widget.js" charset="utf-8"></script>

<script>
    // Swipe Detection Variables
    let touchStartX = 0;
    let touchStartY = 0;
    

    const card = document.getElementById("card");
    const cardback = document.getElementById("back").offsetWidth;
    const cardfront = document.getElementById("front").offsetWidth;
    console.log("back width:",cardback,"front width:",cardfront);
    
    let swipeThreshold;
    if (cardback < cardfront){
      swipeThreshold = cardback -30 // Minimum swipe distance in px
    }else{
      swipeThreshold = cardfront - 30
    }
    

    // Prevent default scrolling when swiping on the card
    card.addEventListener('touchmove', function(event) {
      event.preventDefault();
    }, { passive: false });

    // Touch Start
    card.addEventListener("touchstart", function(evt) {
      const touch = evt.changedTouches[0];
      touchStartX = touch.screenX;
      touchStartY = touch.screenY;
    }, false);

    // Touch End
    card.addEventListener("touchend", function(evt) {
      const touch = evt.changedTouches[0];
      const deltaX = touch.screenX - touchStartX;
      const deltaY = touch.screenY - touchStartY;

      // Check if the swipe is predominantly horizontal
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        if (Math.abs(deltaX) > swipeThreshold) {
          if (deltaX < 0) {
            // Swipe Left
            next();
          } else {
            // Swipe Right
            previous();
          }
        }
      }
      // Reset values
      touchStartX = 0;
      touchStartY = 0;
    }, false);


    document.addEventListener("DOMContentLoaded", () => {
      if (words.length >= 2) {
      }
    });

</script>
