# Collects subtitles from free video sources (Wikimedia Commons, Internet Archive, PeerTube)
# and rebuilds the word → clip index in clips/. Runs weekly, when lib.txt changes, or manually.
name: Build video clips index

on:
  schedule:
    - cron: "17 2 * * 1"        # Mondays 09:17 Hanoi time
  push:
    branches: ["gh-page"]
    paths: ["lib.txt", "tools/clips/user/**"]   # new words, or subtitles archived from index-ai.html
  workflow_dispatch:

permissions:
  contents: write   # commit the new index
  actions: write    # re-run the Pages deploy afterwards

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # to see which files the push changed

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # downloaded subtitles are kept between runs so each run only fetches new videos
      - uses: actions/cache@v4
        with:
          path: tools/clips/.cache
          key: clips-cache-${{ github.run_id }}
          restore-keys: clips-cache-

      # a push that only archives subtitles just re-indexes (a minute); anything else also harvests
      - name: Harvest subtitles and build index
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # (only when the subtitle cache came back: without it an offline build would drop every other video)
          if [ "${{ github.event_name }}" = "push" ] && [ -d tools/clips/.cache/videos ] \
             && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null \
             && ! git diff --name-only "$BEFORE" HEAD | grep -qv '^tools/clips/user/'; then
            node tools/clips/build.mjs --offline
          else
            node tools/clips/build.mjs --minutes 40
          fi

      # low-resolution copies so clips start faster on phones
      - name: Find lighter video versions
        run: node tools/clips/light.mjs

      - name: Commit index
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898429+github-actions[bot]@users.noreply.github.com"
          # every language folder that was built (a language with no words in lib.txt has none)
          git add -A clips
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "clips: update video clip index"
          # another run may have committed the index meanwhile (saving several words quickly starts several runs);
          # this run's files are generated from newer input, so on a conflict they win (-X theirs = the commit being replayed)
          git pull --rebase -X theirs origin gh-page
          git push origin HEAD:gh-page
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # pushes made by this workflow don't trigger other workflows, so start the Pages deploy explicitly
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref gh-page
